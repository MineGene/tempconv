name: Monthly maintenance
on:
  schedule:
    - cron: "0 22 1 * *"
  workflow_dispatch:
permissions:
  issues: write
jobs:
  open-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: gh issue create --repo "$GITHUB_REPOSITORY" --title "Monthly maintenance $(date +%Y-%m)" --body "Follow docs/runbooks/maintenance.md."
        env:
          GH_TOKEN: ${{ github.token }}
